name: Playwright Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  e2e_tests:
    name: 'E2E Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Start services
        run: npm run stack:up
      - name: Install
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
