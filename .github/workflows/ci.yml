# Format, vet and test on every push and pull request. Actions pinned by commit, the
# tag beside it for people.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The views and the local viewer: its offline and CSP tests, the folder sources and the
      # WASI shim.
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
      # The browser build (js/wasm, which go test ./... skips): the module's exports, the
      # plugin runner and the java plugin's goldens through web/viewer/wasi.js, from modules
      # built here for wasip1.
      - name: js/wasm
        run: |
          pre="$RUNNER_TEMP/wasm"
          mkdir -p "$pre"
          GOOS=wasip1 GOARCH=wasm go build -trimpath -buildvcs=false -o "$pre/probe.wasm" ./plugin/wasm/testdata/probe
          GOOS=wasip1 GOARCH=wasm go build -trimpath -buildvcs=false -o "$pre/java.wasm" ./wasmplugins/java
          CERNLY_PLUGINTEST_WASM="$pre" GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/cernly-viewer ./plugin/wasm ./wasmplugins/java
      # The page as released (no signed java bundle yet: built-ins only), then with the test
      # key for the browser tests: a scan in Chromium, Firefox and WebKit gives the CLI's bytes.
      - name: viewer
        run: |
          web/viewer/build.sh
          CERNLY_VIEWER_TEST_PLUGINS=1 web/viewer/build.sh "$RUNNER_TEMP/viewer-test"
      - name: browser tests
        working-directory: web
        env:
          CERNLY_VIEWER_PAGE: ${{ runner.temp }}/viewer-test/cernly-viewer.html
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npx playwright test
      - name: docs build
        run: go run ./cmd/cernly-site
      - name: deterministic
        run: |
          go run ./cmd/cernly scan --repo local/self . > a.json
          go run ./cmd/cernly scan --repo local/self . > b.json
          cmp a.json b.json
  # The release binaries and the viewer build to the same bytes on Linux and
  # macOS: what lets anyone check a release by rebuilding it.
  reproducible:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: |
          scripts/release-build.sh v0.0.0 "$RUNNER_TEMP/rel"
          web/viewer/build.sh "$RUNNER_TEMP/viewer"
          mkdir sums
          cp "$RUNNER_TEMP/rel/binaries.sha256" sums/
          (cd "$RUNNER_TEMP/rel" && shasum -a 256 *.tar.gz *.zip) > sums/archives.sha256
          cp "$RUNNER_TEMP/viewer/SHA256SUMS" sums/viewer.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}
          path: sums
  reproducible-compare:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: |
          cat sums-ubuntu-latest/*
          diff -r sums-ubuntu-latest sums-macos-latest
  # The GitHub Action in action.yml, run from this commit on each runner OS:
  # its facts file is the one `cernly scan` writes. On a pull request this runs
  # the pull request's own action.yml, as go test runs its code: accepted,
  # because the workflow token is contents: read and checkout keeps no
  # credentials.
  action:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: cernly
        uses: ./
        with:
          output: out/self.facts.json
          keep-artifact: ${{ matrix.os == 'ubuntu-latest' }}
      - shell: bash
        env:
          FACTS: ${{ steps.cernly.outputs.facts }}
        run: |
          test "$FACTS" = out/self.facts.json
          go run ./cmd/cernly scan --commit "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/cli.facts.json" .
          cmp "$FACTS" "$RUNNER_TEMP/cli.facts.json"
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (s.repo !== process.argv[2]) { console.error("repo", s.repo); process.exit(1); }' "$FACTS" "github.com/$GITHUB_REPOSITORY"
