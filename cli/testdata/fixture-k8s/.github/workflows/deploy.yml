name: deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: go -C api test ./...
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ghcr.io/example/api:${GITHUB_SHA} api
      - run: kubectl apply -k deploy/k8s/overlays/prod
      - run: helm upgrade --install shop charts/shop -f charts/shop/values-prod.yaml --namespace shop
