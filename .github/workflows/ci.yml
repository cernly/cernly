# Format, vet and test on every push and pull request. Actions pinned by commit, the
# tag beside it for people.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The views and the local viewer: its offline and CSP tests, the WebAssembly module's
      # exports (a js/wasm build, which go test ./... skips) and the one-file build.
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: viewer
        run: |
          GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/cernly-viewer
          web/viewer/build.sh
      - name: docs build
        run: go run ./cmd/cernly-site
      - name: deterministic
        run: |
          go run ./cmd/cernly scan --repo local/self . > a.json
          go run ./cmd/cernly scan --repo local/self . > b.json
          cmp a.json b.json
  # The release binaries and the viewer build to the same bytes on Linux and
  # macOS: what lets anyone check a release by rebuilding it.
  reproducible:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build
        run: |
          scripts/release-build.sh v0.0.0 "$RUNNER_TEMP/rel" --binaries
          web/viewer/build.sh "$RUNNER_TEMP/viewer"
          mkdir sums
          cp "$RUNNER_TEMP/rel/binaries.sha256" sums/
          cp "$RUNNER_TEMP/viewer/SHA256SUMS" sums/viewer.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}
          path: sums
  reproducible-compare:
    needs: reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - run: |
          cat sums-ubuntu-latest/*
          diff -r sums-ubuntu-latest sums-macos-latest
  # The GitHub Action in action.yml, run from this commit on each runner OS:
  # its facts file is the one `cernly scan` writes.
  action:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: cernly
        uses: ./
        with:
          output: out/self.facts.json
          keep-artifact: ${{ matrix.os == 'ubuntu-latest' }}
      - shell: bash
        env:
          FACTS: ${{ steps.cernly.outputs.facts }}
        run: |
          test "$FACTS" = out/self.facts.json
          go run ./cmd/cernly scan --out "$RUNNER_TEMP/cli.facts.json" .
          cmp "$FACTS" "$RUNNER_TEMP/cli.facts.json"
          jq -e '.repo == "github.com/${{ github.repository }}"' "$FACTS"
