# The Cernly scan as a GitHub Action: builds cernly from this commit of the
# action's own source (the Go toolchain and modules that go.mod and go.sum
# pin) and runs `cernly scan` on the checked-out repository. Nothing is sent
# to Cernly: the facts file stays in the workspace and, by default, in a
# workflow artifact of the repository's own run. Pin it by commit:
#
#   - uses: actions/checkout@<sha>
#   - uses: cernly/cernly@<sha> # vX.Y.Z
name: Cernly scan
description: Scan the repository with cernly scan in this job. Nothing leaves the runner except a workflow artifact in your own repository.
author: Cernly
branding:
  icon: layers
  color: gray-dark
inputs:
  path:
    description: The checkout to scan.
    default: "."
  output:
    description: Where the facts file is written, relative to the workspace.
    default: cernly.facts.json
  keep-artifact:
    description: Keep the facts file as a workflow artifact named cernly-facts ("true" or "false").
    default: "true"
outputs:
  facts:
    description: The path of the facts file.
    value: ${{ steps.scan.outputs.facts }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - name: build cernly
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        GOTOOLCHAIN="$(sed -n 's/^toolchain //p' go.mod)" CGO_ENABLED=0 \
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/cernly-action/cernly$(go env GOEXE)" ./cmd/cernly
    - id: scan
      name: cernly scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_OUT: ${{ inputs.output }}
      run: |
        mkdir -p "$(dirname "$SCAN_OUT")"
        "$RUNNER_TEMP/cernly-action/cernly" scan --out "$SCAN_OUT" "$SCAN_PATH"
        echo "facts=$SCAN_OUT" >> "$GITHUB_OUTPUT"
    - if: inputs.keep-artifact == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cernly-facts
        path: ${{ steps.scan.outputs.facts }}
        if-no-files-found: error
