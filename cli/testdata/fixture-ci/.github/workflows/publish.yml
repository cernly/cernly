name: publish
on:
  push:
    branches: [main]
jobs:
  api-image:
    name: API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f apps/api/Dockerfile -t ghcr.io/acme/api:${{ github.sha }} .
      - name: Push
        run: docker push "ghcr.io/acme/api:${{ github.sha }}"
  web-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/acme/web:latest
  e2e-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the e2e runner
        run: docker build -f tests/e2e/Dockerfile -t acme-e2e .
      - name: Run
        run: npx playwright test
