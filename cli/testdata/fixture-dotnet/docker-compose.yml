services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Shop: "Server=db;Database=shop;User Id=sa;TrustServerCertificate=True"
    depends_on:
      - db
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
